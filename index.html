<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Hub — Manajemen Keuangan Syariah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    /* ===========================
       RESET & BASE
    =========================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --surface:   #161616;
      --surface2:  #1f1f1f;
      --border:    #2b2b2b;
      --text:      #f0ebe0;
      --muted:     #6b6b6b;
      --subtle:    #3a3a3a;
      --accent:    #c9a853;
      --accent2:   #e8dcc8;
      --radius:    14px;
      --radius-sm: 8px;
      --nav-h:     60px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
      --page-pad:  clamp(1rem, 4vw, 2rem);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { display: block; width: 100%; object-fit: cover; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    a { text-decoration: none; color: inherit; }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* ===========================
       NAVBAR
    =========================== */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 100;
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 var(--page-pad);
      gap: 1rem;
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.03em;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-logo:hover { opacity: 0.7; }

    .nav-logo-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .nav-spacer { flex: 1; min-width: 0; }

    /* Breadcrumb — hidden on very small screens */
    .nav-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      min-width: 0;
      overflow: hidden;
    }
    .nav-breadcrumb .sep { color: var(--subtle); flex-shrink: 0; }
    .nav-breadcrumb .current {
      color: var(--accent2);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-home {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      font-family: var(--font-body);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-home:hover {
      color: var(--text);
      border-color: var(--subtle);
      background: var(--surface);
    }
    .btn-home svg { width: 13px; height: 13px; }
    /* On very small screens, hide the button label */
    @media (max-width: 380px) {
      .btn-home span { display: none; }
      .btn-home { padding: 6px 10px; }
    }

    /* ===========================
       PAGE WRAPPER
    =========================== */
    #app {
      padding-top: var(--nav-h);
      min-height: 100vh;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* ===========================
       HOME — HERO
    =========================== */
    .home-hero {
      padding: clamp(3rem, 10vw, 7rem) var(--page-pad) clamp(2rem, 5vw, 4rem);
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }
    .hero-label::before {
      content: '';
      display: block;
      width: 20px; height: 1px;
      background: var(--accent);
    }

    .hero-title {
      font-family: var(--font-head);
      font-size: clamp(2.2rem, 8vw, 5.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--text);
      margin-bottom: 1.25rem;
    }
    .hero-title em {
      font-style: normal;
      color: var(--accent);
    }

    .hero-sub {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: var(--muted);
      font-weight: 300;
      max-width: 400px;
      line-height: 1.75;
    }

    /* ===========================
       HOME — CATEGORY GRID
    =========================== */
    .categories-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.5rem var(--page-pad) clamp(3rem, 8vw, 6rem);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: var(--font-head);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-count {
      font-size: 0.75rem;
      color: var(--subtle);
    }

    /* Grid: 1 col mobile → 2 col tablet → 3 col desktop */
    .category-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    @media (min-width: 540px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 900px) {
      .category-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ===========================
       CATEGORY CARD
       Mobile: horizontal layout
       Desktop: vertical layout
    =========================== */
    .category-card {
      position: relative;
      background: var(--surface);
      cursor: pointer;
      overflow: hidden;
      transition: background 0.3s var(--ease);
      /* Mobile: horizontal row */
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.25rem;
      padding: 1.25rem var(--page-pad);
      min-height: 80px;
    }
    @media (min-width: 540px) {
      /* Tablet+: vertical card */
      .category-card {
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        padding: 2rem;
        min-height: 220px;
        gap: 0;
      }
    }

    .category-card:hover { background: var(--surface2); }

    /* Accent bar on top (desktop) / left (mobile) */
    .category-card::before {
      content: '';
      position: absolute;
      background: var(--card-accent, var(--accent));
      transition: transform 0.4s var(--ease);
    }
    /* Mobile: left bar */
    .category-card::before {
      top: 0; left: 0; bottom: 0;
      width: 3px; height: auto;
      transform: scaleY(0);
      transform-origin: top;
    }
    .category-card:hover::before { transform: scaleY(1); }
    /* Desktop: top bar */
    @media (min-width: 540px) {
      .category-card::before {
        top: 0; left: 0; right: 0; bottom: auto;
        width: auto; height: 3px;
        transform: scaleX(0);
        transform-origin: left;
      }
      .category-card:hover::before { transform: scaleX(1); }
    }

    /* Card number */
    .card-num {
      font-family: var(--font-head);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--border);
      user-select: none;
      flex-shrink: 0;
      transition: color 0.3s;
      /* Mobile: smaller */
      font-size: 2.5rem;
    }
    @media (min-width: 540px) {
      .card-num {
        font-size: 4rem;
        margin-bottom: auto;
      }
    }
    .category-card:hover .card-num { color: var(--subtle); }

    /* Card info */
    .card-info {
      flex: 1;
      min-width: 0;
    }
    @media (min-width: 540px) {
      .card-info { margin-top: 1.25rem; }
    }

    .card-subtitle {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
      /* Truncate on mobile */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-title {
      font-family: var(--font-head);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
      /* Mobile: smaller */
      font-size: 1.1rem;
    }
    @media (min-width: 540px) {
      .card-title {
        font-size: 1.4rem;
        margin-bottom: 0.6rem;
      }
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.35rem;
    }

    .card-count {
      font-size: 11px;
      color: var(--muted);
    }

    .card-arrow {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all 0.3s var(--ease);
      flex-shrink: 0;
    }
    .category-card:hover .card-arrow {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      transform: rotate(45deg);
    }
    .card-arrow svg { width: 13px; height: 13px; }

    /* ===========================
       HOME — NOTICE BOX
    =========================== */
    .setup-notice {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--page-pad) clamp(2rem, 6vw, 4rem);
    }

    .notice-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 4vw, 2rem);
      text-align: center;
    }

    .notice-title {
      font-family: var(--font-head);
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    /* ===========================
       CATEGORY PAGE — HEADER
    =========================== */
    .cat-header {
      padding: clamp(2rem, 6vw, 4rem) var(--page-pad) clamp(1.5rem, 4vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
    }

    .cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .cat-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .cat-subtitle {
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      color: var(--muted);
      font-weight: 300;
      margin-top: 0.6rem;
    }

    .cat-stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .stat-item {}
    .stat-num {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    /* ===========================
       GALLERY GRID
       2 col on mobile, 3+ on desktop
    =========================== */
    .gallery-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--page-pad) clamp(3rem, 8vw, 6rem);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }
    @media (min-width: 700px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 1000px) {
      .gallery-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      border-radius: 4px;
    }

    .gallery-item.poster { aspect-ratio: 3/4; }

    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease);
    }
    .gallery-item:hover img,
    .gallery-item:focus img { transform: scale(1.05); }

    /* Overlay — always visible on touch, hover on pointer */
    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 55%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(0.6rem, 2vw, 1.25rem);
      /* On touch: always show. On pointer: only on hover */
      opacity: 1;
      transition: opacity 0.3s;
    }
    /* Devices that support hover — hide until hover */
    @media (hover: hover) and (pointer: fine) {
      .gallery-overlay { opacity: 0; }
      .gallery-item:hover .gallery-overlay { opacity: 1; }
    }

    .overlay-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: var(--accent);
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg);
      width: fit-content;
      margin-bottom: 0.4rem;
    }
    .overlay-badge svg { width: 9px; height: 9px; }

    .overlay-title {
      font-family: var(--font-head);
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
      /* Truncate long titles on mobile */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Play button — only on pointer devices */
    .overlay-play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: clamp(36px, 8vw, 52px);
      height: clamp(36px, 8vw, 52px);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: none; /* Hidden on touch */
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--ease);
      opacity: 0;
      pointer-events: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .overlay-play { display: flex; }
      .gallery-item:hover .overlay-play {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    .overlay-play svg { width: 16px; height: 16px; color: #fff; margin-left: 2px; }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    /* ===========================
       MODAL — Full screen on mobile
    =========================== */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      align-items: flex-end; /* Bottom sheet on mobile */
      justify-content: center;
      padding: 0;
    }
    #modal-overlay.open { display: flex; }

    @media (min-width: 600px) {
      #modal-overlay {
        align-items: center;
        padding: 1rem;
      }
    }

    .modal-box {
      position: relative;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      animation: modal-in 0.35s var(--ease) both;
      /* Mobile: bottom sheet, full width, max 92vh */
      max-height: 92vh;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    @media (min-width: 600px) {
      .modal-box {
        max-width: 840px;
        max-height: 90vh;
        border-radius: var(--radius);
      }
    }

    /* Drag handle on mobile */
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--subtle);
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    @media (min-width: 600px) {
      .modal-handle { display: none; }
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (min-width: 600px) {
      @keyframes modal-in {
        from { opacity: 0; transform: translateY(20px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-family: var(--font-head);
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-close {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all 0.2s;
      flex-shrink: 0;
      /* Larger tap target on mobile */
      min-width: 44px;
      min-height: 44px;
    }
    .modal-close:hover, .modal-close:active {
      background: var(--surface2);
      color: var(--text);
    }
    .modal-close svg { width: 16px; height: 16px; }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .modal-video-wrap {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }
    .modal-video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .modal-poster img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      background: #000;
    }

    /* ===========================
       ANIMATIONS
    =========================== */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim   { animation: fade-up 0.5s var(--ease) both; }
    .anim-d1 { animation-delay: 0.05s; }
    .anim-d2 { animation-delay: 0.1s; }
    .anim-d3 { animation-delay: 0.15s; }
    .anim-d4 { animation-delay: 0.2s; }
    .anim-d5 { animation-delay: 0.25s; }
    .anim-d6 { animation-delay: 0.3s; }

    /* Focus styles for accessibility */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-logo" onclick="navigate('home')" role="button" tabindex="0">
    <span class="nav-logo-dot"></span>
    Gallery Hub
  </div>

  <div class="nav-spacer"></div>

  <div class="nav-breadcrumb" id="breadcrumb" style="display:none;">
    <span onclick="navigate('home')" style="cursor:pointer;">Home</span>
    <span class="sep">›</span>
    <span class="current" id="breadcrumb-label"></span>
  </div>

  <button class="btn-home" id="btn-home" onclick="navigate('home')" style="display:none;" aria-label="Kembali ke Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </button>
</nav>

<div id="app">

  <!-- HOME PAGE -->
  <div id="page-home" class="page active">
    <div class="home-hero">
      <div class="hero-label anim">Gallery Collection</div>
      <h1 class="hero-title anim anim-d1">Manajemen<br>Keuangan <em>Syariah</em></h1>
      <p class="hero-sub anim anim-d2">Explore video karya semua kelompok, terorganisir per pertemuan. Scan barcode untuk akses langsung.</p>
    </div>

    <div class="categories-section">
      <div class="section-header anim anim-d3">
        <span class="section-title">Semua Kategori</span>

    return String(n).padStart(2, '0');
  }

  /* Format category ID into readable label for the tag */
  function formatId(id) {
    if (id === 'uts') return 'UTS';
    if (id === 'uas') return 'UAS';
    // quiz1 → Quiz 1, pertemuan3 → Pertemuan 3
    return id
      .replace(/([a-zA-Z]+)(\d+)/, (_, word, num) =>
        word.charAt(0).toUpperCase() + word.slice(1) + ' ' + num
      );
  }

  /* ---- RENDER HOME ---- */
  function renderHome() {
    const grid = document.getElementById('category-grid');
    const totalItems = GALLERY_DATA.reduce((s, c) => s + c.items.length, 0);
    document.getElementById('total-count').textContent =
      `${GALLERY_DATA.length} kategori · ${totalItems} item`;

    grid.innerHTML = GALLERY_DATA.map((cat, i) => `
      <div class="category-card anim anim-d${Math.min(i + 1, 6)}"
           style="--card-accent: ${cat.accent}"
           onclick="navigate('${cat.id}')"
           role="button" tabindex="0"
           aria-label="Buka ${cat.title}">
        <div class="card-num">${padNum(i + 1)}</div>
        <div class="card-info">
          <div class="card-subtitle">${cat.subtitle}</div>
          <div class="card-title">${cat.title}</div>
          <div class="card-meta">
            <span class="card-count">${cat.items.length} item</span>
            <span class="card-arrow">${SVG_ARR}</span>
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.category-card').forEach(card => {
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
      });
    });
  }

  /* ---- RENDER CATEGORY ---- */
  function renderCategory(categoryId) {
    const cat = GALLERY_DATA.find(c => c.id === categoryId);
    if (!cat) { navigate('home'); return; }

    const vidCount    = cat.items.filter(i => i.type === 'video').length;
    const posterCount = cat.items.filter(i => i.type === 'poster').length;

    document.getElementById('cat-header').innerHTML = `
      <div class="cat-header-text anim">
        <div class="cat-tag" style="color:${cat.accent}">● ${formatId(cat.id)}</div>
        <h1 class="cat-title">${cat.title}</h1>
        <p class="cat-subtitle">${cat.subtitle}</p>
        <div class="cat-stats">
          ${vidCount    ? `<div class="stat-item"><div class="stat-num">${vidCount}</div><div class="stat-label">Video</div></div>` : ''}
          ${posterCount ? `<div class="stat-item"><div class="stat-num">${posterCount}</div><div class="stat-label">Poster</div></div>` : ''}
        </div>
      </div>
    `;

    document.getElementById('gallery-grid').innerHTML = cat.items.length === 0
      ? `<div class="empty-state"><p>Belum ada konten.</p></div>`
      : cat.items.map((item, i) => `
          <div class="gallery-item ${item.type === 'poster' ? 'poster' : ''} anim anim-d${Math.min(i + 1, 6)}"
               onclick='openModal(${JSON.stringify(item)})'
               role="button" tabindex="0"
               aria-label="${item.title}">
            <img src="${item.thumbnail || item.src}" alt="${item.title}" loading="lazy" />
            <div class="gallery-overlay">
              <div class="overlay-badge">
                ${item.type === 'video' ? SVG_PLAY + ' Video' : SVG_IMG + ' Poster'}
              </div>
              <div class="overlay-title">${item.title}</div>
            </div>
            ${item.type === 'video' ? `<div class="overlay-play">${SVG_PLAY}</div>` : ''}
          </div>
        `).join('');

    document.querySelectorAll('.gallery-item').forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.click(); });
    });
  }

  /* ---- MODAL ---- */
  function openModal(item) {
    document.getElementById('modal-title').textContent = item.title;
    document.getElementById('modal-body').innerHTML = item.type === 'video'
      ? `<div class="modal-video-wrap">
           <iframe src="${item.src}"
             allow="autoplay; fullscreen; picture-in-picture"
             allowfullscreen></iframe>
         </div>`
      : `<div class="modal-poster"><img src="${item.src}" alt="${item.title}" /></div>`;

    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-body').innerHTML = '';
    document.body.style.overflow = '';
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* ---- NAVIGATION ---- */
 function navigate(target) {
    const newHash = target === 'home' ? '' : '#' + target;
    if (location.hash !== newHash) {
      try {
        history.pushState(null, '', location.pathname + newHash);
      } catch (e) {
        // Blocked in sandboxed environments (e.g. Claude preview)
        // Hash routing still works fine when deployed on GitHub Pages
      }
    }
    applyRoute(target);
  }
  function applyRoute(target) {
    const isHome = !target || target === 'home';
    document.getElementById('page-home').classList.toggle('active', isHome);
    document.getElementById('page-category').classList.toggle('active', !isHome);
    document.getElementById('btn-home').style.display   = isHome ? 'none' : '';
    document.getElementById('breadcrumb').style.display = isHome ? 'none' : '';

    if (!isHome) {
      const cat = GALLERY_DATA.find(c => c.id === target);
      if (cat) {
        document.getElementById('breadcrumb-label').textContent = cat.title;
        renderCategory(target);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    } else {
      renderHome();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }

  window.addEventListener('popstate', () => {
    applyRoute(location.hash.replace('#', '') || 'home');
  });

  (function init() {
    applyRoute(location.hash.replace('#', '') || 'home');
  })();
</script>
</body>
</html>
