<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    /* ===========================
       RESET & BASE
    =========================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0d;
      --surface:  #161616;
      --surface2: #1f1f1f;
      --border:   #2b2b2b;
      --text:     #f0ebe0;
      --muted:    #6b6b6b;
      --subtle:   #3a3a3a;
      --accent:   #c9a853;
      --accent2:  #e8dcc8;
      --radius:   14px;
      --nav-h:    66px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --ease:     cubic-bezier(0.22, 1, 0.36, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; width: 100%; object-fit: cover; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    a { text-decoration: none; color: inherit; }

    /* ===========================
       NOISE GRAIN OVERLAY
    =========================== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }

    /* ===========================
       NAVBAR
    =========================== */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 100;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1.5rem;
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .nav-logo:hover { opacity: 0.7; }

    .nav-logo-dot {
      width: 9px; height: 9px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .nav-spacer { flex: 1; }

    .nav-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }
    .nav-breadcrumb span.sep { color: var(--subtle); }
    .nav-breadcrumb span.current {
      color: var(--accent2);
      font-weight: 500;
    }

    .btn-home {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .btn-home:hover {
      color: var(--text);
      border-color: var(--subtle);
      background: var(--surface);
    }
    .btn-home svg { width: 14px; height: 14px; }

    /* ===========================
       PAGE WRAPPER
    =========================== */
    #app {
      padding-top: var(--nav-h);
      min-height: 100vh;
    }

    /* ===========================
       SECTION VISIBILITY
    =========================== */
    .page { display: none; }
    .page.active { display: block; }

    /* ===========================
       HOME PAGE
    =========================== */
    #page-home {}

    .home-hero {
      padding: 7rem 2rem 4rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    .hero-label::before {
      content: '';
      display: block;
      width: 24px; height: 1px;
      background: var(--accent);
    }

    .hero-title {
      font-family: var(--font-head);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .hero-title em {
      font-style: normal;
      color: var(--accent);
    }

    .hero-sub {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      max-width: 440px;
      line-height: 1.7;
    }

    /* Category Grid */
    .categories-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem 6rem;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: var(--font-head);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-count {
      font-size: 0.8rem;
      color: var(--subtle);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .category-card {
      position: relative;
      background: var(--surface);
      padding: 2.5rem;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.3s var(--ease);
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .category-card:hover { background: var(--surface2); }

    .category-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: var(--card-accent, var(--accent));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s var(--ease);
    }
    .category-card:hover::before { transform: scaleX(1); }

    .card-num {
      font-family: var(--font-head);
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--border);
      transition: color 0.3s;
      user-select: none;
      margin-bottom: auto;
    }
    .category-card:hover .card-num { color: var(--subtle); }

    .card-info { margin-top: 1.5rem; }

    .card-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-count {
      font-size: 12px;
      color: var(--muted);
    }

    .card-arrow {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all 0.3s var(--ease);
    }
    .category-card:hover .card-arrow {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      transform: rotate(45deg);
    }
    .card-arrow svg { width: 14px; height: 14px; }

    /* ===========================
       CATEGORY PAGE
    =========================== */
    #page-category {}

    .cat-header {
      padding: 4rem 2rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .cat-header-text {}

    .cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .cat-title {
      font-family: var(--font-head);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .cat-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 300;
      margin-top: 0.75rem;
    }

    .cat-stats {
      display: flex;
      gap: 2rem;
      flex-shrink: 0;
    }

    .stat-item { text-align: right; }
    .stat-num {
      font-family: var(--font-head);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    /* Gallery Grid */
    .gallery-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 6rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
    }

    .gallery-item:first-child { border-radius: var(--radius) 0 0 0; }
    .gallery-item:nth-child(-n+3):last-child { border-radius: 0 var(--radius) 0 0; }

    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease);
    }
    .gallery-item:hover img { transform: scale(1.05); }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 60%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.25rem;
    }
    .gallery-item:hover .gallery-overlay { opacity: 1; }

    .overlay-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: var(--accent);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg);
      width: fit-content;
      margin-bottom: 0.5rem;
    }
    .overlay-badge svg { width: 11px; height: 11px; }

    .overlay-title {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
    }

    .overlay-play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 54px; height: 54px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--ease);
      opacity: 0;
    }
    .gallery-item:hover .overlay-play {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .overlay-play svg { width: 20px; height: 20px; color: #fff; margin-left: 3px; }

    /* Poster items */
    .gallery-item.poster { aspect-ratio: 3/4; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    .empty-state p { font-size: 0.9rem; margin-top: 0.5rem; }

    /* ===========================
       MODAL
    =========================== */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #modal-overlay.open { display: flex; }

    .modal-box {
      position: relative;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: modal-in 0.35s var(--ease) both;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      flex: 1;
    }

    .modal-close {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .modal-close:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--subtle);
    }
    .modal-close svg { width: 16px; height: 16px; }

    .modal-body {
      overflow-y: auto;
      flex: 1;
    }

    .modal-video-wrap {
      position: relative;
      padding-top: 56.25%; /* 16:9 */
      background: #000;
    }
    .modal-video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .modal-poster img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      background: #000;
    }

    /* ===========================
       SETUP NOTICE
    =========================== */
    .setup-notice {
      margin: 3rem auto 0;
      max-width: 1200px;
      padding: 0 2rem 4rem;
    }

    .notice-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .notice-title {
      font-family: var(--font-head);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .notice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .notice-item {}
    .notice-item h4 {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.4rem;
    }
    .notice-item p {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .notice-item code {
      display: inline-block;
      margin-top: 0.4rem;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 5px;
      color: var(--accent);
      word-break: break-all;
    }

    /* ===========================
       ANIMATIONS
    =========================== */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim { animation: fade-up 0.55s var(--ease) both; }
    .anim-d1 { animation-delay: 0.05s; }
    .anim-d2 { animation-delay: 0.1s; }
    .anim-d3 { animation-delay: 0.15s; }
    .anim-d4 { animation-delay: 0.2s; }
    .anim-d5 { animation-delay: 0.25s; }
    .anim-d6 { animation-delay: 0.3s; }

    /* ===========================
       RESPONSIVE
    =========================== */
    @media (max-width: 600px) {
      #navbar { padding: 0 1rem; }
      .home-hero { padding: 5rem 1.25rem 2rem; }
      .categories-section, .gallery-wrap { padding-left: 1.25rem; padding-right: 1.25rem; }
      .cat-header { padding: 3rem 1.25rem 2rem; }
      .cat-stats { display: none; }
      .gallery-grid { grid-template-columns: 1fr 1fr; gap: 2px; }
      .notice-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->

  </div>

</nav>

<div id="app">

</div><!-- /app -->

<!-- MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()" aria-label="Tutup">

      </button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- JS renders video or poster -->
    </div>
  </div>
</div>

    ──────────────────────────────────────────────────── */
  ];


  /* ============================================================
     🔧  ENGINE — No need to edit below
  ============================================================ */

  // SVG icons (inline strings reused throughout)
  const SVG_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
  const SVG_IMG  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
  const SVG_ARR  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;

  /* ---- RENDER HOME ---- */
  function renderHome() {
    const grid = document.getElementById('category-grid');
    const totalItems = GALLERY_DATA.reduce((s, c) => s + c.items.length, 0);
    document.getElementById('total-count').textContent = `${GALLERY_DATA.length} kategori · ${totalItems} item`;

    grid.innerHTML = GALLERY_DATA.map((cat, i) => `
      <div class="category-card anim anim-d${Math.min(i+1, 6)}"
           style="--card-accent: ${cat.accent}"
           onclick="navigate('${cat.id}')"
           role="button" tabindex="0"
           aria-label="Buka ${cat.title}">
        <div class="card-num">0${i+1}</div>
        <div class="card-info">
          <div class="card-subtitle">${cat.subtitle}</div>
          <div class="card-title">${cat.title}</div>
          <div class="card-meta">
            <span class="card-count">${cat.items.length} item</span>
            <span class="card-arrow">${SVG_ARR}</span>
          </div>
        </div>
      </div>
    `).join('');

    // keyboard support
    grid.querySelectorAll('.category-card').forEach(card => {
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') card.click();
      });
    });
  }

  /* ---- RENDER CATEGORY ---- */
  function renderCategory(categoryId) {
    const cat = GALLERY_DATA.find(c => c.id === categoryId);
    if (!cat) { navigate('home'); return; }

    const vidCount    = cat.items.filter(i => i.type === 'video').length;
    const posterCount = cat.items.filter(i => i.type === 'poster').length;

    // Header
    document.getElementById('cat-header').innerHTML = `
      <div class="cat-header-text anim">
        <div class="cat-tag" style="color:${cat.accent}">● ${cat.id.replace('pertemuan','Pertemuan ')}</div>
        <h1 class="cat-title">${cat.title}</h1>
        <p class="cat-subtitle">${cat.subtitle}</p>
      </div>
      <div class="cat-stats anim anim-d2">
        ${vidCount    ? `<div class="stat-item"><div class="stat-num">${vidCount}</div><div class="stat-label">Video</div></div>` : ''}
        ${posterCount ? `<div class="stat-item"><div class="stat-num">${posterCount}</div><div class="stat-label">Poster</div></div>` : ''}
      </div>
    `;

    // Gallery grid
    document.getElementById('gallery-grid').innerHTML = cat.items.length === 0
      ? `<div class="empty-state"><p>Belum ada konten.</p><p>Tambahkan item di GALLERY_DATA.</p></div>`
      : cat.items.map((item, i) => `
          <div class="gallery-item ${item.type === 'poster' ? 'poster' : ''} anim anim-d${Math.min(i+1,6)}"
               onclick='openModal(${JSON.stringify(item)})'
               role="button" tabindex="0"
               aria-label="${item.title}">
            <img src="${item.thumbnail || item.src}" alt="${item.title}" loading="lazy" />
            <div class="gallery-overlay">
              <div class="overlay-badge">
                ${item.type === 'video' ? SVG_PLAY + ' Video' : SVG_IMG + ' Poster'}
              </div>
              <div class="overlay-title">${item.title}</div>
            </div>
            ${item.type === 'video' ? `<div class="overlay-play">${SVG_PLAY}</div>` : ''}
          </div>
        `).join('');

    // keyboard
    document.querySelectorAll('.gallery-item').forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.click(); });
    });
  }

  /* ---- MODAL ---- */
  function openModal(item) {
    document.getElementById('modal-title').textContent = item.title;
    document.getElementById('modal-body').innerHTML = item.type === 'video'
      ? `<div class="modal-video-wrap"><iframe src="${item.src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`
      : `<div class="modal-poster"><img src="${item.src}" alt="${item.title}" /></div>`;

    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('open');
    document.getElementById('modal-body').innerHTML = '';
    document.body.style.overflow = '';
  }

  // Close on backdrop click
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Close on Escape
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });


  /* ---- NAVIGATION (hash-based for QR codes) ---- */
  function navigate(target) {
    // update hash
    const newHash = target === 'home' ? '' : '#' + target;
    if (location.hash !== newHash) {
      history.pushState(null, '', location.pathname + newHash);
    }
    applyRoute(target);
  }

  function applyRoute(target) {
    const isHome = !target || target === 'home';

    // Toggle pages
    document.getElementById('page-home').classList.toggle('active', isHome);
    document.getElementById('page-category').classList.toggle('active', !isHome);

    // Navbar
    document.getElementById('btn-home').style.display      = isHome ? 'none' : '';
    document.getElementById('breadcrumb').style.display    = isHome ? 'none' : '';

    if (!isHome) {
      const cat = GALLERY_DATA.find(c => c.id === target);
      if (cat) {
        document.getElementById('breadcrumb-label').textContent = cat.title;
        renderCategory(target);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    } else {
      renderHome();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }

  // Handle browser back/forward
  window.addEventListener('popstate', () => {
    const hash = location.hash.replace('#', '');
    applyRoute(hash || 'home');
  });

  // Initial load — support direct QR links (e.g. gallery.html#pertemuan2)
  (function init() {
    const hash = location.hash.replace('#', '');
    applyRoute(hash || 'home');
  })();
</script>
</body>
</html>
